<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주식 시뮬레이션 게임</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button class="dark-mode-toggle" id="dark-mode-toggle" onclick="toggleDarkMode()">🌙</button>

    <div class="font-size-controls">
        <button class="font-size-btn" id="font-size-btn" onclick="cycleFontSize()" title="폰트 크기 변경">A</button>
    </div>

    <div class="reset-controls">
        <button class="reset-btn" id="reset-btn" onclick="resetLife()" title="인생 리셋">🔄 인생 리셋</button>
    </div>

    <div class="container">
        <h1>📈 주식 시뮬레이션 게임</h1>

        <div class="header-info">
            <div class="info-box">
                <h3>현재 시간</h3>
                <p id="current-time">--:--:--</p>
            </div>
            <div class="info-box">
                <h3>🇰🇷 국내장</h3>
                <p id="market-status-korea" class="market-closed">휴장 중</p>
            </div>
            <div class="info-box">
                <h3>🇺🇸 미국장</h3>
                <p id="market-status-usa" class="market-closed">휴장 중</p>
            </div>
        </div>

        <div class="content-grid">
            <div class="stocks-section">
                <div class="market-tabs">
                    <button id="tab-korea" class="tab-button active" onclick="window.switchTab('korea')">🇰🇷 국내 주식</button>
                    <button id="tab-usa" class="tab-button" onclick="window.switchTab('usa')">🇺🇸 미국 주식</button>
                </div>

                <div class="leverage-controls">
                    <div class="leverage-toggle-container">
                        <label class="toggle-label">
                            <input type="checkbox" id="leverage-toggle">
                            <span class="toggle-text">📊 레버리지 모드</span>
                        </label>
                    </div>
                    <div class="leverage-ratio-container" id="leverage-ratio-container" style="display: none;">
                        <label class="ratio-label">
                            <input type="radio" name="leverage-ratio" value="2" checked>
                            <span>2x</span>
                        </label>
                        <label class="ratio-label">
                            <input type="radio" name="leverage-ratio" value="3">
                            <span>3x</span>
                        </label>
                        <label class="ratio-label">
                            <input type="radio" name="leverage-ratio" value="4">
                            <span>4x</span>
                        </label>
                    </div>
                </div>

                <div id="korea-market" class="tab-panel active">
                    <div id="stock-list-korea" class="stock-list">
                        <!-- 국내 주식 목록 -->
                    </div>
                </div>
                <div id="usa-market" class="tab-panel">
                    <div id="stock-list-usa" class="stock-list">
                        <!-- 미국 주식 목록 -->
                    </div>
                </div>
            </div>

            <div class="player-section">
                <h2 class="section-title">💰 내 정보</h2>

                <div class="player-info-grid">
                    <div class="player-info">
                        <h4>💵 보유 원화</h4>
                        <p id="player-cash-krw">₩0</p>
                    </div>
                    <div class="player-info">
                        <h4>💵 보유 달러</h4>
                        <p id="player-cash-usd">$0</p>
                    </div>
                </div>

                <div class="player-info">
                    <h4>📈 총 자산 (원화 기준)</h4>
                    <p id="player-total">₩0</p>
                </div>

                <div class="exchange-section">
                    <h4>💱 환전소</h4>
                    <div class="exchange-rate-display">
                        <p class="exchange-rate" id="exchange-rate">1 USD = 1300 KRW</p>
                        <span class="rate-change" id="rate-change"></span>
                    </div>
                    <div class="exchange-controls">
                        <div class="exchange-input-container">
                            <label for="exchange-amount-input">환전 금액 (USD):</label>
                            <input type="number" id="exchange-amount-input" min="1" value="100" step="1">
                        </div>
                        <div class="exchange-buttons">
                            <button class="exchange-btn" onclick="window.exchangeHandler('krw_to_usd')">원화→달러</button>
                            <button class="exchange-btn" onclick="window.exchangeHandler('usd_to_krw')">달러→원화</button>
                        </div>
                    </div>
                </div>

                <div class="holdings-list">
                    <h4>📦 보유 주식</h4>
                    <div id="holdings-container">
                        <p class="empty-holdings">보유 중인 주식이 없습니다</p>
                    </div>
                </div>

                <div class="holdings-list">
                    <h4>📊 레버리지 포지션</h4>
                    <div id="leverage-positions-container">
                        <p class="empty-holdings">레버리지 포지션이 없습니다</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="game-over" class="game-over hidden">
        <div class="game-over-content">
            <h2>💸 파산!</h2>
            <p id="game-over-message">자산이 0 이하가 되었습니다.</p>
            <button class="restart-btn" onclick="restartGame()">🔄 다시 시작</button>
        </div>
    </div>

    <div id="chart-modal" class="chart-modal hidden" onclick="closeChart()">
        <div class="chart-content" onclick="event.stopPropagation()">
            <div class="chart-header">
                <h2 class="chart-title" id="chart-stock-name">차트</h2>
                <button class="chart-close" onclick="closeChart()">✕ 닫기</button>
            </div>
            <canvas id="price-chart"></canvas>
        </div>
    </div>

    <!-- 호가창 모달 -->
    <div id="order-book-modal" class="order-book-modal hidden" onclick="closeOrderBook()">
        <div class="order-book-content" onclick="event.stopPropagation()">
            <div class="order-book-header">
                <h2 class="order-book-title" id="order-book-stock-name">호가창</h2>
                <button class="order-book-close" onclick="closeOrderBook()">✕ 닫기</button>
            </div>

            <div class="order-book-main">
                <!-- 호가창 -->
                <div class="order-book-grid">
                    <!-- 매도 호가 -->
                    <div class="sell-orders-section">
                        <div class="order-header sell-header">
                            <span class="header-price">매도호가</span>
                            <span class="header-quantity">잔량</span>
                        </div>
                        <div id="sell-orders-list" class="orders-list">
                            <!-- 매도 호가 5단계 -->
                        </div>
                    </div>

                    <!-- 현재가 -->
                    <div class="current-price-section">
                        <div class="current-price-display">
                            <span class="current-price-label">현재가</span>
                            <span class="current-price-value" id="order-book-current-price">₩0</span>
                            <span class="current-price-change" id="order-book-price-change">0%</span>
                        </div>
                    </div>

                    <!-- 매수 호가 -->
                    <div class="buy-orders-section">
                        <div class="order-header buy-header">
                            <span class="header-price">매수호가</span>
                            <span class="header-quantity">잔량</span>
                        </div>
                        <div id="buy-orders-list" class="orders-list">
                            <!-- 매수 호가 5단계 -->
                        </div>
                    </div>
                </div>

                <!-- 주문 입력 폼 -->
                <div class="order-input-section">
                    <div class="order-type-tabs">
                        <button class="order-tab active" id="buy-tab" onclick="switchOrderType('buy')">매수</button>
                        <button class="order-tab" id="sell-tab" onclick="switchOrderType('sell')">매도</button>
                    </div>

                    <div class="order-form">
                        <div class="order-method">
                            <label class="order-method-label">
                                <input type="radio" name="order-method" value="limit" checked onchange="window.onOrderMethodChange()">
                                <span>지정가</span>
                            </label>
                            <label class="order-method-label">
                                <input type="radio" name="order-method" value="market" onchange="window.onOrderMethodChange()">
                                <span>시장가</span>
                            </label>
                        </div>

                        <div class="order-inputs">
                            <div class="order-input-group">
                                <label for="order-price">주문가격</label>
                                <input type="number" id="order-price" placeholder="가격 입력" min="1" step="1">
                            </div>
                            <div class="order-input-group">
                                <label for="order-quantity">주문수량</label>
                                <input type="number" id="order-quantity" placeholder="수량 입력" min="1" value="1" step="1">
                            </div>
                        </div>

                        <button class="order-submit-btn" id="order-submit-btn" onclick="submitOrder()">매수 주문</button>
                    </div>
                </div>

                <!-- 미체결 주문 목록 -->
                <div class="pending-orders-section">
                    <h4>📋 미체결 주문</h4>
                    <div id="pending-orders-list" class="pending-orders-list">
                        <p class="no-orders">미체결 주문이 없습니다</p>
                    </div>
                </div>

                <!-- 최근 체결 내역 -->
                <div class="recent-trades-section">
                    <h4>📊 최근 체결</h4>
                    <div id="recent-trades-list" class="recent-trades-list">
                        <p class="no-trades">체결 내역이 없습니다</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
    <script>
        // 레버리지 토글 이벤트 리스너
        document.addEventListener('DOMContentLoaded', function() {
            const leverageToggle = document.getElementById('leverage-toggle');
            const leverageRatioContainer = document.getElementById('leverage-ratio-container');

            if (leverageToggle) {
                leverageToggle.addEventListener('change', function() {
                    if (this.checked) {
                        leverageRatioContainer.style.display = 'flex';
                    } else {
                        leverageRatioContainer.style.display = 'none';
                    }
                });
            }
        });
    </script>
</body>
</html>
