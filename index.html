<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주식 시뮬레이션 게임</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button class="dark-mode-toggle" id="dark-mode-toggle" onclick="toggleDarkMode()">🌙</button>

    <div class="font-size-controls">
        <button class="font-size-btn" id="font-size-btn" onclick="cycleFontSize()" title="폰트 크기 변경">A</button>
    </div>

    <div class="container">
        <h1>📈 주식 시뮬레이션 게임</h1>

        <div class="header-info">
            <div class="info-box">
                <h3>현재 시간</h3>
                <p id="current-time">--:--:--</p>
            </div>
            <div class="info-box">
                <h3>시장 상태</h3>
                <p id="market-status" class="market-closed">휴장 중</p>
            </div>
        </div>

        <div class="content-grid">
            <div class="stocks-section">
                <h2 class="section-title">📊 주식 시장</h2>
                <div id="stock-list" class="stock-list">
                    <!-- 주식 목록이 여기에 동적으로 추가됩니다 -->
                </div>
            </div>

            <div class="player-section">
                <h2 class="section-title">💰 내 정보</h2>

                <div class="player-info">
                    <h4>💵 현금</h4>
                    <p id="player-cash">$10000</p>
                </div>

                <div class="player-info">
                    <h4>📈 총 자산</h4>
                    <p id="player-total">$10000</p>
                </div>

                <div class="holdings-list">
                    <h4>📦 보유 주식</h4>
                    <div id="holdings-container">
                        <p class="empty-holdings">보유 중인 주식이 없습니다</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="game-over" class="game-over hidden">
        <div class="game-over-content">
            <h2>💸 파산!</h2>
            <p id="game-over-message">자산이 0 이하가 되었습니다.</p>
            <button class="restart-btn" onclick="restartGame()">🔄 다시 시작</button>
        </div>
    </div>

    <div id="chart-modal" class="chart-modal hidden" onclick="closeChart()">
        <div class="chart-content" onclick="event.stopPropagation()">
            <div class="chart-header">
                <h2 class="chart-title" id="chart-stock-name">차트</h2>
                <button class="chart-close" onclick="closeChart()">✕ 닫기</button>
            </div>
            <canvas id="price-chart"></canvas>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
